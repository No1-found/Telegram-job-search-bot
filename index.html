<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  />
  <title>Submit Job Post</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    html, body {
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    body {
      overscroll-behavior: contain;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 16px;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 28px;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 20px;
    }

    .user-info {
      background: #f5f6fa;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      display: block;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 2px solid #e0e0e0;
      font-size: 14px;
      background: white;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #667eea;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
    }

    button:disabled {
      opacity: 0.6;
    }

    .alert {
      display: none;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 14px;
    }

    .alert.success {
      background: #d4edda;
      color: #155724;
    }

    .alert.error {
      background: #f8d7da;
      color: #721c24;
    }

    .alert.show {
      display: block;
    }

    .required {
      color: #e74c3c;
    }

    .view-tabs {
      display: flex;
      gap: 8px;
      margin: 0 0 20px;
      padding: 4px;
      background: #f5f6fa;
      border-radius: 12px;
    }

    .view-tab {
      flex: 1;
      margin: 0;
      padding: 10px 12px;
      background: transparent;
      color: #667085;
      font-size: 14px;
    }

    .view-tab.active {
      background: white;
      color: #4f46e5;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .jobs-panel {
      display: none;
    }

    .jobs-panel.active {
      display: block;
    }

    .jobs-toolbar {
      display: grid;
      grid-template-columns: 1fr 150px;
      gap: 8px;
      margin-bottom: 14px;
    }

    .jobs-toolbar input,
    .jobs-toolbar select {
      min-width: 0;
    }

    .refresh-button {
      width: 100%;
      margin: 0 0 16px;
      padding: 11px;
      font-size: 14px;
    }

    .jobs-status {
      color: #667085;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .job-card {
      border: 1px solid #e7e7ef;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      background: #fff;
    }

    .job-card h2 {
      font-size: 17px;
      line-height: 1.35;
      margin-bottom: 6px;
    }

    .job-company {
      color: #4f46e5;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .job-meta {
      color: #667085;
      font-size: 13px;
      line-height: 1.6;
    }

    .job-description {
      color: #475467;
      font-size: 13px;
      line-height: 1.5;
      margin: 10px 0;
    }

    .apply-button {
      display: inline-block;
      width: auto;
      margin: 4px 0 0;
      padding: 10px 16px;
      text-decoration: none;
      text-align: center;
    }

    .empty-state {
      padding: 24px 8px;
      text-align: center;
      color: #667085;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      .container { padding: 20px; }
      .jobs-toolbar { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>📋 Submit Job Post</h1>
    <p class="subtitle">Fill in the details to post a new job opportunity</p>

    <div id="userInfo" class="user-info" style="display:none;">
      👤 Logged in as <strong id="userName"></strong>
    </div>

    <div id="alert" class="alert"></div>

    <div class="view-tabs" role="tablist" aria-label="Job bot views">
      <button type="button" class="view-tab active" data-view="submit">Submit a job</button>
      <button type="button" class="view-tab" data-view="jobs">Latest jobs</button>
    </div>

    <section id="jobsPanel" class="jobs-panel" aria-labelledby="jobsHeading">
      <h2 id="jobsHeading" style="font-size:22px; margin-bottom:6px;">📢 Latest Bengaluru Jobs</h2>
      <p class="subtitle">New openings from the last 7 days. Apply through the official listing.</p>

      <form id="jobsFilterForm" class="jobs-toolbar">
        <input id="jobSearch" type="search" placeholder="Search title, company, or skill" aria-label="Search jobs" />
        <select id="jobCategory" aria-label="Filter by category">
          <option value="">All categories</option>
          <option value="private">Private jobs</option>
          <option value="government">Government / PSU</option>
        </select>
      </form>
      <button id="refreshJobs" type="button" class="refresh-button">Refresh latest jobs</button>
      <div id="jobsStatus" class="jobs-status" aria-live="polite"></div>
      <div id="jobsList"></div>
    </section>

    <form id="jobForm">
      <div class="form-group">
        <label>Job Title <span class="required">*</span></label>
        <input type="text" id="title" required placeholder="e.g., Senior Frontend Developer" />
      </div>

      <div class="form-group">
        <label>Company Name <span class="required">*</span></label>
        <input type="text" id="company" required placeholder="e.g., Tech Corp Inc." />
      </div>

      <div class="form-group">
        <label>Location <span class="required">*</span></label>
        <input type="text" id="location" required placeholder="e.g., Remote, New York, or Bangalore" />
      </div>

      <div class="form-group">
        <label>Job Type <span class="required">*</span></label>
        <select id="type" required>
          <option value="">Select job type</option>
          <option value="Full-time">Full-time</option>
          <option value="Part-time">Part-time</option>
          <option value="Contract">Contract</option>
          <option value="Freelance">Freelance</option>
          <option value="Internship">Internship</option>
        </select>
      </div>

      <div class="form-group">
        <label>Salary Range</label>
        <input type="text" id="salary" placeholder="e.g., $80,000 - $120,000 or Not disclosed" />
      </div>

      <div class="form-group">
        <label>Job Description <span class="required">*</span></label>
        <textarea id="description" required placeholder="Describe the role, responsibilities, and requirements..."></textarea>
      </div>

      <p style="font-size: 13px; color: #666; margin: 16px 0 8px;">
        <strong>Contact Method:</strong> Provide at least one
      </p>

      <div class="form-group">
        <label>Application Link</label>
        <input type="url" id="applyLink" placeholder="https://company.com/apply" />
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="jobs@company.com" />
      </div>

      <div class="form-group">
        <label>Phone / WhatsApp Number</label>
        <input type="tel" id="phone" placeholder="+1 234 567 8900 or WhatsApp: +91 98765 43210" />
      </div>

      <button id="submitBtn" type="submit">Submit Job Post</button>
    </form>
  </div>

  <script>
    const CONFIG = {
      WORKER_URL: 'https://tgjbt.puneethtpp.workers.dev/api/submit-job',
      LATEST_JOBS_URL: 'https://tgjbt.puneethtpp.workers.dev/api/latest-jobs',
      ACCESS_CHECK_URL: 'https://tgjbt.puneethtpp.workers.dev/api/access-check',
      USER_ID: null
    };

    const alertBox = document.getElementById('alert');
    const submitBtn = document.getElementById('submitBtn');
    const jobForm = document.getElementById('jobForm');
    const jobsPanel = document.getElementById('jobsPanel');
    const jobsList = document.getElementById('jobsList');
    const jobsStatus = document.getElementById('jobsStatus');
    const jobsFilterForm = document.getElementById('jobsFilterForm');
    let telegramWebApp = null;

    function showAlert(msg, type) {
      alertBox.textContent = msg;
      alertBox.className = `alert ${type} show`;
      setTimeout(() => alertBox.classList.remove('show'), 5000);
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>'"]/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[character]));
    }

    function safeApplyLink(value) {
      try {
        const url = new URL(value);
        return ['http:', 'https:'].includes(url.protocol) ? url.toString() : '';
      } catch (_) {
        return '';
      }
    }

    function formatJobDate(value) {
      const date = new Date(value);
      return Number.isNaN(date.getTime())
        ? 'Date not specified'
        : date.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function setView(view, updateUrl = true) {
      const showJobs = view === 'jobs';
      jobForm.style.display = showJobs ? 'none' : 'block';
      jobsPanel.classList.toggle('active', showJobs);
      document.querySelectorAll('.view-tab').forEach(button => {
        button.classList.toggle('active', button.dataset.view === view);
      });
      if (updateUrl) {
        const nextUrl = new URL(window.location.href);
        if (showJobs) nextUrl.searchParams.set('view', 'jobs');
        else nextUrl.searchParams.delete('view');
        window.history.replaceState({}, '', nextUrl);
      }
      if (showJobs) loadJobs();
    }

    function renderJobs(jobs) {
      if (!jobs.length) {
        jobsList.innerHTML = '<div class="empty-state">No matching jobs were found in the latest 7-day window.</div>';
        return;
      }

      jobsList.innerHTML = jobs.map(job => {
        const applyLink = safeApplyLink(job.applyLink);
        const contact = [job.email, job.phone].filter(Boolean).map(escapeHtml).join(' · ');
        const action = applyLink
          ? `<a class="apply-button" href="${escapeHtml(applyLink)}" target="_blank" rel="noopener noreferrer">🔗 Apply now</a>`
          : (contact ? `<div class="job-meta">Contact: ${contact}</div>` : '<div class="job-meta">Application details are in the listing.</div>');
        return `<article class="job-card">
          <h2>${escapeHtml(job.title)}</h2>
          <div class="job-company">🏢 ${escapeHtml(job.company)}</div>
          <div class="job-meta">📍 ${escapeHtml(job.location)} · 🧾 ${escapeHtml(job.jobType)}<br>🗓️ Posted ${escapeHtml(formatJobDate(job.publishedAt))}</div>
          ${job.deadline ? `<div class="job-meta">⏳ Apply by ${escapeHtml(formatJobDate(job.deadline))}</div>` : ''}
          ${job.salary ? `<div class="job-meta">💰 ${escapeHtml(job.salary)}</div>` : ''}
          ${job.description ? `<p class="job-description">${escapeHtml(job.description)}</p>` : ''}
          ${action}
        </article>`;
      }).join('');
    }

    async function loadJobs() {
      const query = document.getElementById('jobSearch').value.trim();
      const category = document.getElementById('jobCategory').value;
      const params = new URLSearchParams({ limit: '50', days: '7' });
      if (query) params.set('q', query);
      if (category) params.set('category', category);

      jobsStatus.textContent = 'Loading latest jobs…';
      jobsList.innerHTML = '';
      try {
        const res = await fetch(`${CONFIG.LATEST_JOBS_URL}?${params.toString()}`);
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || 'Unable to load jobs');
        jobsStatus.textContent = `${data.count} latest job${data.count === 1 ? '' : 's'} found`;
        renderJobs(data.jobs || []);
      } catch (error) {
        jobsStatus.textContent = '';
        jobsList.innerHTML = `<div class="empty-state">Unable to load jobs right now. Please try again.</div>`;
        console.error('Latest jobs error:', error);
      }
    }

    async function checkSubmitAccess() {
      const submitTab = document.querySelector('.view-tab[data-view="submit"]');
      if (!telegramWebApp?.initData || !CONFIG.USER_ID) {
        submitTab.hidden = true;
        setView('jobs', false);
        return;
      }

      try {
        const res = await fetch(CONFIG.ACCESS_CHECK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ initData: telegramWebApp.initData })
        });
        const data = await res.json();
        if (!res.ok || !data.success || !data.canSubmit) {
          submitTab.hidden = true;
          setView('jobs', false);
          showAlert('Browse access enabled. Job submission is limited to authorized users.', 'error');
          return;
        }
        submitTab.hidden = false;
      } catch (error) {
        submitTab.hidden = true;
        setView('jobs', false);
        showAlert('Could not verify submission access. Browse mode enabled.', 'error');
        console.error('Access check error:', error);
      }
    }

    // Initialize Telegram Web App when available. The public jobs view also works in a normal browser.
    document.addEventListener('DOMContentLoaded', () => {
      telegramWebApp = window.Telegram?.WebApp || null;
      if (telegramWebApp?.initDataUnsafe?.user) {
        telegramWebApp.ready();
        telegramWebApp.expand();
        telegramWebApp.enableClosingConfirmation();
        telegramWebApp.disableVerticalSwipes();
        const user = telegramWebApp.initDataUnsafe.user;
        CONFIG.USER_ID = user.id;
        document.getElementById('userName').textContent = user.first_name || 'User';
        document.getElementById('userInfo').style.display = 'block';
      }

      document.querySelectorAll('.view-tab').forEach(button => {
        button.addEventListener('click', () => setView(button.dataset.view));
      });
      jobsFilterForm.addEventListener('submit', event => {
        event.preventDefault();
        loadJobs();
      });
      document.getElementById('refreshJobs').addEventListener('click', loadJobs);

      const initialView = new URLSearchParams(window.location.search).get('view') === 'jobs' ? 'jobs' : 'submit';
      setView(CONFIG.USER_ID ? initialView : 'jobs', false);
      checkSubmitAccess();
    });

    // Form submission
    jobForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!CONFIG.USER_ID) {
        showAlert('❌ User ID not found. Please open this form through Telegram.', 'error');
        return;
      }

      // Validate at least one contact method
      const applyLink = document.getElementById('applyLink').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();

      if (!applyLink && !email && !phone) {
        showAlert('⚠️ Please provide at least one contact method (Link, Email, or Phone)', 'error');
        return;
      }

      // Build payload with explicit getElementById calls
      const payload = {
        title: document.getElementById('title').value.trim(),
        company: document.getElementById('company').value.trim(),
        location: document.getElementById('location').value.trim(),
        type: document.getElementById('type').value,
        salary: document.getElementById('salary').value.trim(),
        description: document.getElementById('description').value.trim(),
        applyLink: applyLink,
        email: email,
        phone: phone,
        userId: CONFIG.USER_ID,
        initData: telegramWebApp?.initData || ''
      };

      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';

      try {
        const res = await fetch(CONFIG.WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        
        if (data.success) {
          showAlert('✅ Job submitted successfully! It will be reviewed before posting.', 'success');
          document.getElementById('jobForm').reset();
          
          // Close Telegram Web App after success
          setTimeout(() => {
            if (window.Telegram && Telegram.WebApp) {
              Telegram.WebApp.close();
            }
          }, 2000);
        } else {
          showAlert('❌ Error: ' + (data.error || 'Submission failed'), 'error');
        }
      } catch (error) {
        showAlert('❌ Network error. Please try again.', 'error');
        console.error('Submission error:', error);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Job Post';
      }
    });
  </script>
</body>
</html>
